<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta name="robots" content="{{ robots }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SuperSXO">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  {{ structured_data }}
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/interface-state.js" defer></script>
  <script src="/static/js/theme-toggle.js" defer></script>
  <script src="/static/js/sxo-score.js" defer></script>
</head>
<body class="{{ body_class }}">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="control-plane-shell">

    {{ header }}

    <main id="main-content" class="main-plane" tabindex="-1">
      {{ content }}
    </main>

    {{ footer }}

  </div>

</body>
</html>
